name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only meaningful on a PR diff (compares base vs. head manifests) —
    # a push to main has no "other side" to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4.9.0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Trivy scan (analytics container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the analytics image (same Dockerfile CI/prod use)
        working-directory: services/analytics
        run: docker build -t draftcourt-analytics:security-scan .

      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: draftcourt-analytics:security-scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # CVE-specific, time-bounded risk acceptance only (see the file):
          # unfixable-on-bookworm findings with machine-enforced expiry.
          # Anything NOT listed there still fails this gate.
          trivyignores: services/analytics/.trivyignore
