[project]
name = "draftcourt-analytics"
version = "0.0.0"
description = "DraftCourt analytics service — internal FastAPI service for ingestion, projections, and model evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sentry-sdk[fastapi]==2.68.0",
  "asyncpg==0.31.0",
  "python-json-logger==4.2.0",
  "sqlalchemy[asyncio]==2.0.44",
  "pandas==2.3.3",
  "numpy==2.3.4",
  "scipy==1.16.3",
  "rapidfuzz==3.14.1",
  "typer==0.20.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.4",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "scipy-stubs==1.16.2.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
markers = [
    "integration: requires a reachable migrated Postgres (skipped otherwise)",
]

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
